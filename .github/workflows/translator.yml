name: Translator APK and focused tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/translator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.0.13004108'
      - name: Build APK and test translator and Telex
        run: |
          chmod +x gradlew
          VERSION_CODE=$((410100 + GITHUB_RUN_NUMBER))
          ./gradlew :app:assembleDebugNoMinify :app:testDebugUnitTest --tests '*DeepLClientTest' --tests '*VietnameseTelexTest' --tests '*TelexChainTest' --tests '*InputLogicTest*telex*' --no-daemon --max-workers=2 -Pkotlin.incremental=false -PheliboardVersionCode="$VERSION_CODE" -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.compiler.execution.strategy=in-process
      - name: Sign stable APK
        id: sign
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.HELIBOARD_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo "::warning::Add HELIBOARD_SIGNING_BUNDLE_B64 under repository Actions secrets to enable permanent APK signing."
            exit 0
          fi
          umask 077
          install -d "$RUNNER_TEMP/heliboard-signing" app/build/outputs/permanentlySigned
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/heliboard-signing/keys.zip"
          unzip -q "$RUNNER_TEMP/heliboard-signing/keys.zip" -d "$RUNNER_TEMP/heliboard-signing"
          test -s "$RUNNER_TEMP/heliboard-signing/key.p12"
          test -s "$RUNNER_TEMP/heliboard-signing/password.txt"
          APP=app/build/outputs/apk/debugNoMinify/HeliBoard_4.1-debugNoMinify.apk
          SIGNED=app/build/outputs/permanentlySigned/HeliBoard-Vietnamese-Telex-DeepL-signed.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" sign --ks "$RUNNER_TEMP/heliboard-signing/key.p12" --ks-type PKCS12 --ks-key-alias heliboard --ks-pass "file:$RUNNER_TEMP/heliboard-signing/password.txt" --key-pass "file:$RUNNER_TEMP/heliboard-signing/password.txt" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$APP"
          "$SIGNER" verify --verbose --print-certs "$SIGNED" > "$RUNNER_TEMP/heliboard-signing/verification.txt"
          FINGERPRINT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/heliboard-signing/verification.txt" | head -1)
          EXPECTED=07df108de8865d1b7c4f70d4674a8e5aec114c5bac1f907616981638556e85e9
          test "${FINGERPRINT,,}" = "$EXPECTED" || { echo "::error::Signing certificate fingerprint mismatch"; exit 1; }
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: success() && steps.sign.outputs.signed == 'true'
        with:
          name: HeliBoard-signed-${{ github.run_number }}
          path: app/build/outputs/permanentlySigned/HeliBoard-Vietnamese-Telex-DeepL-signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeliBoard-focused-tests-${{ github.run_number }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
